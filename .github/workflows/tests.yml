name: tests
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # Frontend tu dřív nebyl, takže se změna v něm po mergnutí do main
      # neověřila vůbec. Teď na něm visí i průchodový test v prohlížeči.
      - "frontend/**"
      - ".github/workflows/tests.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        # Bez lidl-plus a recipe-scrapers: jejich tranzitivní závislost
        # jstyleson má rozbitý sdist build a testy je nepotřebují.
        run: |
          grep -vE '^(lidl-plus|recipe-scrapers)' backend/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt simplemma
      - name: Run backend tests
        working-directory: backend
        run: |
          python -m tests.test_lookup
          python -m tests.test_llm_match
          python -m tests.test_auth_and_search
          python -m tests.test_translate
          python -m tests.test_units
          python -m tests.test_textnorm
          python -m tests.test_ingredients
          python -m tests.test_groups
          python -m tests.test_feed
          python -m tests.test_system
          python -m tests.test_migrations
          python -m tests.test_recipe_export
          python -m tests.test_review
          python -m tests.test_taxonomy
          python -m tests.test_ingredient_tree
          python -m tests.test_scraper_cleanup
          python -m tests.test_corpus_audit
          python -m tests.test_llm_stats
          python -m tests.test_providers

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        # Prohlížeč se tady stahovat nemusí, ten potřebuje až e2e job níž.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm run build

  # Průchodový test v opravdovém prohlížeči. Build výš ověří, že se kód
  # přeloží – ne že appka funguje. Tímhle sítem propadla chyba, kvůli které
  # se výpis receptů zacyklil na načítání a hlavní stránka zůstala prázdná.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps
        run: |
          grep -vE '^(lidl-plus|recipe-scrapers)' backend/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt simplemma
      - name: Build frontend and serve it from the app
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm run build
          rm -rf ../backend/app/static
          cp -r dist ../backend/app/static
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Seed database and start the app
        working-directory: backend
        run: |
          python -m tests.seed_e2e /tmp/e2e.db
          DATABASE_URL="sqlite:////tmp/e2e.db" AUTH_ENABLED=false \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8099 \
            > /tmp/uvicorn.log 2>&1 &
          # Čekat na připravenost, ne na pevný sleep – start migruje schéma.
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:8099/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "Appka nenaběhla:"; cat /tmp/uvicorn.log; exit 1
      - name: Run browser smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: App log on failure
        if: failure()
        run: cat /tmp/uvicorn.log
